title: DaffaDev
email: your@email.com
description: >-
  Situs sederhana yang memadukan tampilan personal dan blog Jekyll.
baseurl: ""
url: "https://daffadevhosting.github.io"
lang: "id-ID"
author: "DaffaDev"

license_key: "<%= ENV['license_key'] %>"
ads_image: "https://s3.cdnppp889.com/uploads/20056/827051ace0a69aba81499565318fcfe1.png"
ads_link: "https://rkgg7pt.com/s/0328C386078"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - dotenv

plugins_dir: _plugins

collections:
  blogpost:
    output: true

permalink: /blogpost/:title/

defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "post"
      writer: "Daffa"

markdown: kramdown

exclude:
  - Gemfile.lock
  - node_modules/
  - vendor/
