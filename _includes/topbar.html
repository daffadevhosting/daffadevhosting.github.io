<div class="top-bar">
    <!-- Tombol R2 Explorer Tambahan di Topbar (Membuka laci kanan secara mandiri) -->
     <ion-buttons>
      <ion-button id="openR2Btn" aria-label="Buka Cloud Storage" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
        <ion-icon name="folder-open-outline" slot="icon-only"></ion-icon>
      </ion-button>
     </ion-buttons>
  
  <!-- Pilihan Model AI yang Terintegrasi di Topbar dengan Mode iOS Popover -->
<div class="model-selector-wrap" id="modelSelector">
  <ion-select
    class="model-selector-select"
    mode="ios"
    interface="popover"
    aria-label="Pilih model AI"
    placeholder="Pilih model"
    value="@cf/qwen/qwen2.5-coder-32b-instruct"
  >
    <ion-select-option value="@cf/qwen/qwen2.5-coder-32b-instruct">
      Qwen Coder 32B
    </ion-select-option>
    <ion-select-option value="@cf/qwen/qwen3-30b-a3b-fp8">
      Qwen 3 30B
    </ion-select-option>
    <ion-select-option value="@cf/openai/gpt-oss-20b">
      GPT OSS
    </ion-select-option>
  </ion-select>
</div>

  <div class="topbar-profile" id="topbarProfile" style="display: flex; align-items: center; gap: 8px;">
    <ion-button fill="clear" class="topbar-profile-btn" id="topbarProfileBtn" aria-label="Buka menu pengguna">
      <span class="topbar-avatar" id="topbarAvatar" style="display: inline-block; width: 28px; height: 28px; border-radius: 50%; background-color: #30363d;"></span>
      <span class="topbar-username" id="topbarMiniUsername">Tamu</span>
    </ion-button>
  </div>
</div>

<!-- SIDEBAR PROFIL PENGEMBANG -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar-panel" id="sidebarPanel" inert>
  <!-- Tombol tutup -->
  <ion-buttons class="sidebar-close-wrapper">
    <ion-button id="sidebarCloseBtn" aria-label="Tutup menu" class="sidebar-close-btn">
      <ion-icon name="close-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-buttons>

  <!-- Header profil -->
  <div class="sidebar-header">
    <div class="sidebar-avatar" id="sidebarAvatar">
      <!-- Avatar akan diisi lewat JS, atau bisa pakai img -->
    </div>
    <div class="sidebar-user-info">
      <h3 id="sidebarUsername">Tamu</h3>
      <p class="sidebar-followers" id="sidebarFollowers">
        <ion-icon name="people-outline" class="followers-icon"></ion-icon>
        <span>0 Followers</span>
      </p>
    </div>
  </div>

  <!-- Kartu Kuota AI Harian -->
  <div class="sidebar-neuron-card" id="sidebarNeuronCard">
    <div class="neuron-card-header">
      <ion-icon name="speedometer-outline" class="neuron-icon"></ion-icon>
      <span class="neuron-title">Kuota AI Harian</span>
    </div>
    <div class="neuron-card-stats">
      <span id="sidebarNeuronText" class="neuron-count">10.000 NRN</span>
      <span class="neuron-percent" id="sidebarNeuronPercent">100%</span>
    </div>
    <div class="neuron-progress-bg">
      <div class="neuron-progress-bar" id="sidebarNeuronBar" style="width: 100%;"></div>
    </div>
  </div>

  <!-- Bagian aksi (status & tombol) -->
  <div class="sidebar-body">
    <p class="sidebar-status" id="sidebarStatus">
      <ion-icon name="information-circle-outline" class="status-icon"></ion-icon>
      Belum login.
    </p>
    <div class="sidebar-actions">
      <a href="#" id="sidebarLoginBtn" class="sidebar-action-btn primary">Login GitHub</a>
      <button type="button" id="sidebarLogoutBtn" class="sidebar-action-btn secondary hidden">Logout</button>
    </div>
  </div>
</aside>
<!-- SIDEBAR BARU: PANEL FILE EXPLORER CLOUDFLARE R2 (Sisi Kanan) -->
<div class="r2-sidebar-backdrop" id="r2Backdrop"></div>
<aside class="r2-sidebar-panel" id="r2Panel" inert>
  <button type="button" class="sidebar-close" id="r2CloseBtn" aria-label="Tutup File Cloud">
    <ion-icon name="close-outline"></ion-icon>
  </button>
  
  <div class="sidebar-header" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 20px;">
    <div class="r2-header-icon" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.2); display: flex; justify-content: center; align-items: center; color: #58a6ff; font-size: 20px; margin-right: 12px;">
      <ion-icon name="cloud-done-outline"></ion-icon>
    </div>
    <div>
      <h3 style="font-size: 16px; margin: 0; font-weight: 600; color: #ffffff;">Cloud File Storage</h3>
      <p style="font-size: 11px; color: #8b949e; margin: 2px 0 0;">Cloudflare Bucket Manager</p>
    </div>
  </div>

  <!-- Drag and Drop Area untuk Unggah File ke R2 -->
  <div class="r2-upload-zone" id="r2UploadZone" style="border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px 16px; text-align: center; margin: 16px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.01); display: none;">
    <input type="file" id="r2FileInput" style="display: none;" />
    <ion-icon name="arrow-up-circle-outline" style="font-size: 32px; color: #58a6ff; margin-bottom: 8px;"></ion-icon>
    <p style="font-size: 12px; font-weight: 500; margin: 0; color: #e6edf3;">Unggah File ke Cloud</p>
    <p style="font-size: 10px; color: #8b949e; margin: 4px 0 0;">Klik atau seret file ke area ini</p>
  </div>

  <!-- Kontainer List File R2 -->
  <div class="r2-file-section" style="flex: 1; overflow-y: auto; padding: 0 16px 20px;">
    <h4 style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #8b949e; margin: 0 0 12px 4px; font-weight: 600;">File Saya</h4>
    <div id="r2FileList" style="display: flex; flex-direction: column; gap: 8px;">
      <!-- File list item di-render secara dinamis lewat js -->
      <div style="text-align: center; color: #8b949e; font-size: 12px; padding: 30px 0;">Belum ada file terunggah.</div>
    </div>
  </div>
</aside>
