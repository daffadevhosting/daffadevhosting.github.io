<footer class="footer footer-container">
  <!-- Gemini Style Premium Chat Box Container (Mode Putih / Terang) -->
  <div class="chat-box folded" id="chatBoxContainer">

    <!-- Indikator File Terlampir -->
    <div id="fileAttachedIndicator" class="hidden">
      <div class="attached-file-badge">
        <ion-icon name="document-text-outline"></ion-icon>
        <span id="attachedFileName">script.js</span>
        <button type="button" id="removeAttachedFileBtn" aria-label="Hapus Lampiran">
          <ion-icon name="close-circle"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Area Mengetik -->
    <textarea class="chat-textarea" id="chatInput" rows="1" placeholder="Tanyakan sesuatu..."></textarea>

    <!-- Baris Aksi/Tombol -->
    <div class="chat-action-row" id="chatActionRow">
      <div class="chat-left-actions">
        <button type="button" id="attachScriptBtn" class="chat-action-icon-btn" title="Lampirkan-Kode-Script">
          <ion-icon name="attach-outline"></ion-icon>
        </button>
        <input type="file" id="chatScriptFileInput" accept=".txt,.js,.ts,.html,.css,.json,.py,.java,.sh,.md,.php,.cpp" style="display: none;" />

        <!-- Petunjuk Format yang Didukung -->
        <span class="chat-tip-text">Mendukung file script (.js, .py, dll)</span>
      </div>

      <div class="chat-right-actions">
        <!-- Tombol Kirim Bulat Premium -->
        <button id="sendBtn" class="chat-send-circle-btn" type="button" aria-label="Kirim-Pesan">
          <ion-icon name="arrow-up-outline"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav-row" id="bottomNavRow">
    <div class="nav-pill-box">
      <div class="nav-item active" data-tab="home">
        <ion-icon name="chatbubbles"></ion-icon>
        Chat
      </div>
      <div class="nav-item" data-tab="discover">
        <ion-icon name="compass-outline"></ion-icon>
        Discover
      </div>
      <div class="nav-item" data-tab="library">
        <ion-icon name="folder-outline"></ion-icon>
        Library
      </div>
    </div>
<ion-button
  class="side-action-btn"
  fill="clear"
  id="sideActionBtn"
  aria-label="New Chat"
  title="New Chat"
>
  <ion-icon
    slot="icon-only"
    id="sideActionIcon"
    name="add-outline"
    style="font-size: 22px;"
  ></ion-icon>
</ion-button>
  </div>
<span id="footer" style="display:block;text-align:center;font-size:10px;color:#aaa;">
 daffadevhosting.github.io
</span>
  <!-- Wadah Notifikasi Kustom -->
  <div id="customToastContainer" class="toast-container"></div>

  <script>
    // Kontrol r2UploadZone berdasarkan status login
    function updateR2UploadZoneVisibility() {
      const r2UploadZone = document.getElementById('r2UploadZone');
      const sidebarStatus = document.getElementById('sidebarStatus');
      
      if (r2UploadZone && sidebarStatus) {
        const isLoggedIn = !sidebarStatus.textContent.includes('Belum login');
        r2UploadZone.style.display = isLoggedIn ? 'block' : 'none';
      }
    }

    // Kontrol bottom-nav-row saat chatBoxContainer diklik (karena chatInput tidak menerima klik langsung)
    function setupBottomNavVisibility() {
      const bottomNavRow = document.getElementById('bottomNavRow');
      const chatInput = document.getElementById('chatInput');
      const chatBoxContainer = document.getElementById('chatBoxContainer');
      
      if (!bottomNavRow || !chatInput || !chatBoxContainer) return;

      // Gunakan event focus/blur dari chatInput (sudah diatur di module.html)
      chatInput.addEventListener('focus', () => {
        bottomNavRow.classList.add('hidden');
      });

      chatInput.addEventListener('blur', () => {
        // Beri delay untuk memastikan blur benar-benar selesai
        setTimeout(() => {
          if (document.activeElement !== chatInput) {
            bottomNavRow.classList.remove('hidden');
          }
        }, 100);
      });

      // Tambahan: Saat chatBoxContainer diklik, bottom-nav-row juga hilang
      chatBoxContainer.addEventListener('click', (e) => {
        // Abaikan jika klik pada tombol atau input file
        if (e.target.closest('button') || e.target.closest('input[type="file"]') || e.target.closest('.attached-file-badge')) {
          return;
        }
        bottomNavRow.classList.add('hidden');
      });
    }

    // Panggil saat DOM siap
    document.addEventListener('DOMContentLoaded', () => {
      updateR2UploadZoneVisibility();
      setupBottomNavVisibility();
    });

    // Jika ada sistem login yang memicu event, listen disini
    document.addEventListener('loginStatusChanged', updateR2UploadZoneVisibility);
  </script>
</footer>
